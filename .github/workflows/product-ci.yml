name: Product CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the release Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          architecture: x64
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
          python-version: "3.14.3"

      - name: Install the hash-locked CI tool
        run: >-
          python -m pip install --no-deps --only-binary=:all:
          --require-hashes -r .github/requirements-ci.txt

      - name: Record tool versions
        run: |
          python --version
          ruff --version

      - name: Run product tests
        run: python -m unittest discover -s Tools\tests

      - name: Run survey tests
        run: >-
          python -m unittest discover -s .develope\survey
          -t .develope\survey -p test_*.py

      - name: Validate repository documents
        run: python Tools\validate_document_links.py

      - name: Validate bilingual Prompt samples
        run: python Tools\validate_prompt_samples.py

      - name: Run required Ruff rules
        run: ruff check --select E,F,B Tools\dcsmizzer Tools\tests

      - name: Compile product and survey Python
        run: python -m compileall -q Tools .develope\survey
